name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Package quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Deterministic checks
        run: sh scripts/check.sh

      - name: Gate unit tests
        run: python3 -m unittest discover -s tests/gate

  rules:
    name: PHP rule tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - id: composer-cache
        name: Locate composer cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: PHPStan rule tests
        run: vendor/bin/pest --filter=PHPStan

      - name: Unused public code
        run: vendor/bin/phpstan analyse -c phpstan-dead-code.neon --no-progress --memory-limit=1G

      - name: Full Pest suite (Linux)
        run: vendor/bin/pest

      - name: Gate unit tests with the rule suite
        run: python3 -m unittest discover -s tests/gate
